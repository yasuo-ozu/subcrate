[package]
name = "example"
version = "0.1.0"
edition = "2021"
rust-version = "1.56"
build = "build.rs"
publish = false

[dependencies]
subcrate = { path = "../.." }

[build-dependencies]
subcrate = { path = "../.." }

[features]
# Gates tests that use `mod foo;` inside a subcrate — a nightly-only capability
# (non-inline modules in proc-macro input are unstable, E0658, on stable). The
# nightly CI job enables it; stable jobs leave those test crates empty.
nightly = []
