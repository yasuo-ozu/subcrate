[package]
name = "subcrate"
description = "Define real, independently compiled Rust crates with inline `#[subcrate]` module syntax."
version = "0.2.3"
edition = "2021"
rust-version = "1.56"
license = "MIT"
repository = "https://github.com/yasuo-ozu/subcrate"
readme = "README.md"
# `build.rs` is the build-helper module, not a build script.
build = false
# Integration tests are their own package (`subcrate-tests`, ./tests).
autotests = false
# Nested test/benchmark packages (and the `tests` symlink) are not published.
exclude = ["/tests", "/benchmarks", "/member-test"]

[lib]
path = "lib.rs"

[dependencies]
# The `#[subcrate]` attribute; always available.
subcrate-macros = { path = "macro", version = "0.2.3" }
# The rest back `subcrate::build::compile()`, behind the default `build` feature,
# so attribute-only users can opt out with `default-features = false`.
subcrate-core = { path = "core", version = "0.2.3", optional = true }
syn = { version = "2", features = ["full", "parsing", "printing"], optional = true }
proc-macro2 = { version = "1", optional = true }
template-quote = { version = "0.3", optional = true }
# Topological sort of subcrates (no `matrix`/`sprs`).
safegraph = { version = "0.3", default-features = false, optional = true }

[features]
default = ["build", "precise-diagnostics"]
# Named directly (not `dep:`) to stay parseable at the 1.56 MSRV.
build = ["subcrate-core", "syn", "proc-macro2", "template-quote", "safegraph"]
# Rewrite a failing subcrate's `<anon>:line:col` diagnostics to the user's real file
# and line. It turns on `proc-macro2/span-locations`, which Cargo unifies across every
# crate in the graph it reaches (slowing their proc-macro work and changing
# `proc_macro2::Span` behaviour). On by default; keep the build helper without it with
# `default-features = false, features = ["build"]`.
precise-diagnostics = ["build", "proc-macro2/span-locations"]

[workspace]
resolver = "2"
members = [
    "core",
    "macro",
    "tests",
    "member-test",
    "examples/backed",
    "examples/custom-layout",
    "examples/doc-macros",
    "examples/explicit-targets",
    "examples/leaf",
    "examples/leaf-alt",
    "examples/leaf-base",
    "examples/pm",
    "examples/pm-user",
]
# Bare `cargo test`/`build` at the root fans out to every member (`.` is `subcrate`).
default-members = [
    ".",
    "core",
    "macro",
    "tests",
    "member-test",
    "examples/backed",
    "examples/custom-layout",
    "examples/doc-macros",
    "examples/explicit-targets",
    "examples/leaf",
    "examples/leaf-alt",
    "examples/leaf-base",
    "examples/pm",
    "examples/pm-user",
]
# Its own workspace: keeps trybuild out of the MSRV-locked `Cargo.lock`.
exclude = ["benchmarks"]
