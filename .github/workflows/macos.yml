name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # arm64 (macos-latest, Apple Silicon) and amd64 (macos-15-intel, Intel).
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Covers the Unix-but-not-Linux surface: APFS hard-link/inode behaviour,
      # a case-insensitive filesystem, and macOS path handling.
      - uses: ./.github/actions/build-test
