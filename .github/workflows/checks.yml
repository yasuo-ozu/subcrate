name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  # One in-flight run per workflow per ref: a new push to a PR cancels the
  # superseded run, while pushes to main always run to completion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    name: Nightly-only tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default nightly
          rustc --version
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: nightly
      # Exercises the `mod foo;`-inside-a-subcrate tests, which require nightly
      # (non-inline modules in proc-macro input are unstable on stable).
      - run: cargo test -p subcrate-tests --features nightly

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: doc
      - run: cargo doc --no-deps -p subcrate -p subcrate-core -p subcrate-macros
