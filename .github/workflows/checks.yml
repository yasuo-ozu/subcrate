name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: Nightly-only tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly --profile minimal --target x86_64-unknown-none --no-self-update
          rustup default nightly
          rustc --version
      # Exercises the `mod foo;`-inside-a-subcrate tests, which require nightly
      # (non-inline modules in proc-macro input are unstable on stable).
      - run: cargo test -p subcrate-tests --features nightly

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo doc --no-deps -p subcrate -p subcrate-core -p subcrate-macros

  no-std:
    name: Attribute-only build for a target without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-none --no-self-update
          rustup default stable
      # Without the `build` feature `subcrate` is `#![no_std]` and only the attribute is
      # left, so a `no_std` package can depend on it.
      - run: cargo build -p subcrate --no-default-features --target x86_64-unknown-none
