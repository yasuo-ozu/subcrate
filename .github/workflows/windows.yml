name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 (windows-11-arm is GitHub's arm64 Windows runner).
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Exercises the whole machinery on Windows: the nested Cargo build, `rustc`
      # over stdin, proc-macro `.dll` linking, and the artifact hard-linking step.
      - uses: ./.github/actions/build-test
