name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 (windows-11-arm is GitHub's arm64 Windows runner).
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Exercises the whole machinery on Windows: the nested Cargo build, `rustc`
      # over stdin, proc-macro `.dll` linking, and the artifact hard-linking step.
      - uses: ./.github/actions/build-test

  # The GNU (MinGW) toolchain instead of the matrix's default MSVC: host ==
  # target == x86_64-pc-windows-gnu (native, not a cross build), exercising the
  # GNU linker and `.dll` handling that MSVC does not. It cannot reuse the
  # `build-test` action, whose `rustup default stable` would reset to the MSVC
  # host, so the toolchain swap and the two commands are spelled out here.
  windows-gnu:
    name: Test (windows-gnu, native)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install and default to the windows-gnu toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - name: Test (default features)
        run: cargo test --workspace
      - name: Build the attribute-only path (no default features)
        run: cargo check -p subcrate --no-default-features
