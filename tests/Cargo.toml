[package]
name = "subcrate-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.56"
publish = false
# Runs `subcrate::build::compile()`, checking the `#[subcrate]` tests at build time.
build = "build.rs"

[dependencies]
# Attribute + `build::compile` (build_api.rs); needs the default `build` feature.
subcrate = { path = ".." }
# Owner dependencies used by owner.rs (`#[subcrate(::leaf)]`); `alt` renames `leaf-alt`.
leaf = { path = "../examples/leaf" }
leaf-base = { path = "../examples/leaf-base" }
alt = { package = "leaf-alt", path = "../examples/leaf-alt" }
# A dependency backed by subcrates itself (transitive.rs).
backed = { path = "../examples/backed" }
# Toolchain-conditional subcrates (rustversion_gate.rs): the `#[rustversion::…]`
# attribute that gates a `#[subcrate]` module in the parent crate.
rustversion = "1"

[build-dependencies]
subcrate = { path = ".." }

[dev-dependencies]
subcrate-core = { path = "../core" }
syn = "2"

[features]
# On by default, so the suite tells `--no-default-features` from the defaults.
default = ["owner_feature"]
# Gates tests whose subcrate body uses `mod foo;` (unstable in proc-macro input on stable).
nightly = []
# Regression for issue 2: a default-on feature of the owner, read by a subcrate
# that links `::subcrate_tests`, to prove the owner's nested build honours the
# outer build's features (owner.rs).
owner_feature = []
# Regression for issue 3: gates a `should_error` subcrate on a feature that is off
# by default, which must then be skipped (not checked). See cfg_gate.rs.
ui_case = []
