[package]
name = "subcrate-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.56"
publish = false
# Runs `subcrate::build::compile()`, checking the `#[subcrate]` tests at build time.
build = "build.rs"

[dependencies]
# Attribute + `build::compile` (build_api.rs); needs the default `build` feature.
subcrate = { path = ".." }
# Owner dependencies used by owner.rs (`#[subcrate(::leaf)]`); `alt` renames `leaf-alt`.
leaf = { path = "../examples/leaf" }
leaf-base = { path = "../examples/leaf-base" }
alt = { package = "leaf-alt", path = "../examples/leaf-alt" }
# Toolchain-conditional subcrates (rustversion_gate.rs): the `#[rustversion::…]`
# attribute that gates a `#[subcrate]` module in the parent crate.
rustversion = "1"

[build-dependencies]
subcrate = { path = ".." }

[dev-dependencies]
subcrate-core = { path = "../core" }
syn = "2"

[features]
# Gates tests whose subcrate body uses `mod foo;` (unstable in proc-macro input on stable).
nightly = []
